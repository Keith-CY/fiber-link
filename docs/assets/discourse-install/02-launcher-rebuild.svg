<circle cx="105" cy="90" r="9" fill="#ef4444"/><circle cx="133" cy="90" r="9" fill="#f59e0b"/><circle cx="161" cy="90" r="9" fill="#22c55e"/>
<text x="195" y="96" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e5e7eb">Terminal</text>
<text x="90" y="148" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Rebuild the Discourse app container</text>
<rect x="90" y="176" width="1100" height="502" rx="16" fill="#0b1220"/>
<rect x="90" y="176" width="8" height="502" rx="4" fill="#38bdf8"/>
<text x="122" y="220" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#67e8f9">$ cd /var/discourse</text>
<text x="122" y="250" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#67e8f9">$ ./launcher rebuild app</text>
<text x="122" y="280" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e5e7eb"></text>
<text x="122" y="310" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e5e7eb">... Installing plugins ...</text>
<text x="122" y="340" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#86efac">... Cloning fiber-link into plugins/fiber-link ...</text>
<text x="122" y="370" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e5e7eb">... Precompiling assets ...</text>
<text x="122" y="400" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e5e7eb">Successfully bootstrapped, rebuilt and started app</text>
<text x="122" y="430" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e5e7eb"></text>
<text x="122" y="460" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#94a3b8"># If rebuild fails, remove the hook and run ./launcher rebuild app again.</text>
<text x="90" y="702" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Illustrative screenshot for Fiber Link operator docs. Replace placeholders with site-specific values.</text>
